<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi‑Agent Research Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            plugins: [],
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .copy-success {
            background-color: #10b981 !important;
            transition: background-color 0.2s ease;
        }

        /* Pipeline tracker */
        .pipeline { display: flex; align-items: center; gap: 0; }
        .pipeline-step {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.75rem; font-weight: 500;
            color: rgba(255,255,255,0.35);
            transition: color 0.3s ease; white-space: nowrap;
        }
        .pipeline-step .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(255,255,255,0.2); flex-shrink: 0;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .pipeline-connector {
            flex: 1; height: 1px; background: rgba(255,255,255,0.15);
            min-width: 18px; max-width: 36px; margin: 0 4px;
            transition: background 0.4s ease;
        }
        .pipeline-step.active { color: rgba(255,255,255,0.9); }
        .pipeline-step.active .dot {
            background: #a78bfa;
            box-shadow: 0 0 6px 2px rgba(167,139,250,0.6);
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 4px 1px rgba(167,139,250,0.5); }
            50%       { box-shadow: 0 0 10px 4px rgba(167,139,250,0.9); }
        }
        .pipeline-step.done { color: rgba(255,255,255,0.6); }
        .pipeline-step.done .dot { background: #34d399; box-shadow: none; animation: none; }
        .pipeline-connector.done { background: rgba(52,211,153,0.5); }

        /* ── Report markdown styles ─────────────────────────────────────── */
        /* Scoped to #reportContent so they don't bleed out */
        #reportContent { color: #e2e8f0; line-height: 1.75; font-size: 0.95rem; }

        #reportContent h1 {
            font-size: 1.6rem; font-weight: 700;
            color: #f1f5f9; margin: 1.6rem 0 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 0.4rem;
        }
        #reportContent h2 {
            font-size: 1.25rem; font-weight: 600;
            color: #e2e8f0; margin: 1.4rem 0 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 0.3rem;
        }
        #reportContent h3 {
            font-size: 1.05rem; font-weight: 600;
            color: #cbd5e1; margin: 1.2rem 0 0.5rem;
        }
        #reportContent h4, #reportContent h5, #reportContent h6 {
            font-size: 0.95rem; font-weight: 600;
            color: #94a3b8; margin: 1rem 0 0.4rem;
        }
        #reportContent p { margin: 0.65rem 0; }

        #reportContent ul, #reportContent ol {
            padding-left: 1.5rem; margin: 0.65rem 0;
        }
        #reportContent ul { list-style-type: disc; }
        #reportContent ol { list-style-type: decimal; }
        #reportContent li { margin: 0.3rem 0; }
        #reportContent li::marker { color: #a78bfa; }

        #reportContent a {
            color: #a78bfa; text-decoration: underline;
            text-underline-offset: 2px;
        }
        #reportContent a:hover { color: #c4b5fd; }

        #reportContent strong { font-weight: 600; color: #f1f5f9; }
        #reportContent em     { font-style: italic; color: #cbd5e1; }

        #reportContent code {
            background: rgba(167,139,250,0.15);
            color: #c4b5fd; padding: 0.1em 0.35em;
            border-radius: 4px; font-size: 0.875em;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
        }
        #reportContent pre {
            background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 1rem; overflow-x: auto;
            margin: 1rem 0;
        }
        #reportContent pre code {
            background: none; padding: 0; color: #e2e8f0; font-size: 0.85rem;
        }
        #reportContent blockquote {
            border-left: 3px solid #7c3aed;
            padding: 0.5rem 0 0.5rem 1rem;
            margin: 1rem 0; color: #94a3b8;
            background: rgba(124,58,237,0.08);
            border-radius: 0 6px 6px 0;
        }
        #reportContent hr {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 1.5rem 0;
        }
        #reportContent table {
            width: 100%; border-collapse: collapse; margin: 1rem 0;
            font-size: 0.9rem;
        }
        #reportContent th {
            background: rgba(124,58,237,0.25);
            color: #e2e8f0; font-weight: 600;
            padding: 0.5rem 0.75rem; text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        #reportContent td {
            padding: 0.45rem 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        #reportContent tr:hover td { background: rgba(255,255,255,0.03); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen">
    <div class="container mx-auto px-4 py-12 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center p-1 bg-gradient-to-r from-purple-500 to-blue-500 rounded-full mb-4">
                <div class="bg-slate-900 rounded-full p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                </div>
            </div>
            <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-white to-purple-300 bg-clip-text text-transparent">Multi‑Agent Research</h1>
            <p class="text-gray-300 mt-2 max-w-2xl mx-auto">Powered by LangGraph, GPT-3.5‑turbo & Brave Search</p>
        </div>

        <!-- Main card -->
        <div class="glass rounded-2xl shadow-2xl p-6 md:p-8 backdrop-blur-lg border border-white/20">
            <div class="space-y-6">
                <div>
                    <label class="block text-gray-200 font-medium mb-2">Research question</label>
                    <textarea id="queryInput" rows="3" class="w-full p-4 bg-slate-800/50 border border-slate-600 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-none" placeholder="e.g., 'What are the latest trends in open-source LLM agents?'"></textarea>
                </div>
                <div>
                    <label class="block text-gray-200 font-medium mb-2">Research depth</label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <label class="relative flex items-center justify-center p-3 bg-slate-800/50 rounded-xl border border-slate-600 cursor-pointer transition-all has-[:checked]:bg-purple-600/20 has-[:checked]:border-purple-500">
                            <input type="radio" name="depth" value="fast" class="sr-only peer">
                            <div class="text-center">
                                <div class="font-semibold text-gray-200 peer-checked:text-purple-300">Fast</div>
                                <div class="text-xs text-gray-400">No revision – immediate answer</div>
                            </div>
                        </label>
                        <label class="relative flex items-center justify-center p-3 bg-slate-800/50 rounded-xl border border-slate-600 cursor-pointer transition-all has-[:checked]:bg-purple-600/20 has-[:checked]:border-purple-500">
                            <input type="radio" name="depth" value="standard" checked class="sr-only peer">
                            <div class="text-center">
                                <div class="font-semibold text-gray-200 peer-checked:text-purple-300">Standard</div>
                                <div class="text-xs text-gray-400">One revision cycle</div>
                            </div>
                        </label>
                        <label class="relative flex items-center justify-center p-3 bg-slate-800/50 rounded-xl border border-slate-600 cursor-pointer transition-all has-[:checked]:bg-purple-600/20 has-[:checked]:border-purple-500">
                            <input type="radio" name="depth" value="deep" class="sr-only peer">
                            <div class="text-center">
                                <div class="font-semibold text-gray-200 peer-checked:text-purple-300">Deep</div>
                                <div class="text-xs text-gray-400">Multiple revisions, thorough</div>
                            </div>
                        </label>
                    </div>
                </div>
                <button id="researchBtn" class="w-full py-3 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white font-semibold rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    Start Research
                </button>
            </div>
        </div>

        <!-- Pipeline progress tracker -->
        <div id="pipelineTracker" class="mt-6 glass rounded-2xl px-6 py-4 border border-white/20" style="display:none;">
            <div class="pipeline" id="pipelineSteps">
                <div class="pipeline-step" id="step-planning"><span class="dot"></span>Planning</div>
                <div class="pipeline-connector" id="conn-1"></div>
                <div class="pipeline-step" id="step-searching"><span class="dot"></span>Searching</div>
                <div class="pipeline-connector" id="conn-2"></div>
                <div class="pipeline-step" id="step-writing"><span class="dot"></span>Writing</div>
                <div class="pipeline-connector" id="conn-3"></div>
                <div class="pipeline-step" id="step-reviewing"><span class="dot"></span>Reviewing</div>
                <div class="pipeline-connector" id="conn-4"></div>
                <div class="pipeline-step" id="step-done"><span class="dot"></span>Done</div>
            </div>
            <div class="mt-2 flex items-center gap-2">
                <p id="pipelineSubLabel" class="text-xs text-gray-400 truncate"></p>
                <span id="iterationBadge" class="hidden text-xs font-semibold px-2 py-0.5 rounded-full bg-purple-700/50 text-purple-200"></span>
            </div>
        </div>

        <!-- Report container -->
        <div id="reportContainer" class="mt-8 glass rounded-2xl p-6 md:p-8 backdrop-blur-lg border border-white/20" style="display: none;">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-white/20 pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    <h2 class="text-xl font-semibold text-white">Research Report</h2>
                </div>
                <div class="flex gap-2">
                    <button id="copyReportBtn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-sm rounded-lg transition flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        Copy
                    </button>
                    <button id="downloadReportBtn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-sm rounded-lg transition flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        Download
                    </button>
                </div>
            </div>
            <div id="reportContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
